# GitHub Actions workflow for CmdPal History Extension
# 
# This workflow automatically:
# - Builds the C# project on every push and pull request to the main branch
# - Runs tests using Windows runner (required for Windows Desktop/WPF applications)
# - Publishes the resulting DLL and all dependencies as workflow artifacts called "binaries"
# - On tagged releases, creates a ZIP package and uploads it to the GitHub Release
#
# To use with a different branch, change the branch name in the "on" section below.

name: Build and Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore CmdPalHistoryExtension.csproj
        dotnet restore CmdPalHistoryExtension.Tests/CmdPalHistoryExtension.Tests.csproj

    - name: Build
      run: dotnet build CmdPalHistoryExtension.csproj --configuration Release --no-restore

    - name: Build Tests
      run: dotnet build CmdPalHistoryExtension.Tests/CmdPalHistoryExtension.Tests.csproj --configuration Release --no-restore

    - name: Test
      run: dotnet test CmdPalHistoryExtension.Tests/CmdPalHistoryExtension.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish binaries
      run: dotnet publish CmdPalHistoryExtension.csproj --configuration Release --output ./publish --no-build

    - name: Upload binaries as artifact
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: ./publish/
        if-no-files-found: error

    - name: Create release package
      if: github.event_name == 'release'
      run: |
        $version = "${{ github.ref_name }}"
        $zipName = "CmdPalHistoryExtension-${version}.zip"
        Compress-Archive -Path './publish/*' -DestinationPath $zipName -Force
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Upload binaries to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
